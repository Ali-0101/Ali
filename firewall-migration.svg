<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4f4a"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#002a27" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- links -->
  <g stroke="#ccfbf1" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M440 118V196"/>
    <path d="M440 262V318"/>
    <path d="M440 362V392M440 392H260V420M440 392V420M440 392H620V420"/>
  </g>
  <g fill="#5eead4">
    <circle r="5"><animateMotion dur="2.4s" repeatCount="indefinite" path="M440 118V196"/></circle>
    <circle r="5"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M440 262V318"/></circle>
  </g>

  <!-- WAN cloud -->
  <g filter="url(#sh)">
    <path d="M376 112c-20 0-34-14-34-31 0-16 13-29 30-30 6-20 25-33 46-33 22 0 40 14 46 33 2 0 3 0 5 0 19 0 34 14 34 31s-15 30-34 30z" fill="#fff"/>
  </g>
  <text x="440" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">WAN</text>

  <!-- old firewall (decommissioned) -->
  <g opacity=".55">
    <rect x="60" y="196" width="190" height="66" rx="12" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".6" stroke-dasharray="6 6" stroke-width="2"/>
    <text x="155" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">FortiGate 61E</text>
    <text x="155" y="248" text-anchor="middle" font-size="12" fill="#fff">old unit</text>
  </g>
  <path d="M262 229H318" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M312 220l12 9-12 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- new firewall -->
  <g filter="url(#sh)">
    <rect x="330" y="196" width="220" height="66" rx="12" fill="#fff"/>
  </g>
  <rect x="346" y="212" width="34" height="34" rx="8" fill="#0f766e"/>
  <path d="M363 218l-11 4v7c0 7 5 12 11 14 6-2 11-7 11-14v-7z" fill="#5eead4"/>
  <text x="392" y="227" font-size="15" font-weight="700" fill="#134e4a">FortiGate 70G</text>
  <text x="392" y="247" font-size="12" fill="#0f766e">new · online</text>
  <g fill="#22c55e"><circle cx="528" cy="216" r="4"/><circle cx="528" cy="230" r="4"/></g>
  <circle cx="528" cy="244" r="4" fill="#5eead4"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>

  <!-- switch -->
  <g filter="url(#sh)">
    <rect x="320" y="318" width="240" height="44" rx="10" fill="#134e4a"/>
  </g>
  <g fill="#5eead4">
    <rect x="336" y="333" width="16" height="14" rx="2"/><rect x="358" y="333" width="16" height="14" rx="2"/>
    <rect x="380" y="333" width="16" height="14" rx="2"/><rect x="402" y="333" width="16" height="14" rx="2"/>
    <rect x="424" y="333" width="16" height="14" rx="2" fill-opacity=".4"/><rect x="446" y="333" width="16" height="14" rx="2" fill-opacity=".4"/>
  </g>
  <text x="540" y="345" text-anchor="end" font-size="12" font-weight="700" fill="#ccfbf1">SWITCH</text>

  <!-- endpoints -->
  <g filter="url(#sh)">
    <circle cx="260" cy="450" r="30" fill="#fff"/>
    <circle cx="440" cy="450" r="30" fill="#fff"/>
    <circle cx="620" cy="450" r="30" fill="#fff"/>
  </g>
  <!-- POS -->
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round">
    <rect x="246" y="436" width="28" height="20" rx="3"/><path d="M252 456v8h16v-8"/>
  </g>
  <!-- wifi AP -->
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round">
    <path d="M426 446a20 20 0 0 1 28 0"/><path d="M431 452a12 12 0 0 1 18 0"/>
  </g>
  <circle cx="440" cy="460" r="3" fill="#0f766e"/>
  <!-- PC -->
  <g fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round">
    <rect x="604" y="436" width="32" height="21" rx="3"/><path d="M614 465h12M620 457v8"/>
  </g>

  <!-- downtime badge -->
  <g filter="url(#sh)">
    <rect x="590" y="36" width="174" height="40" rx="20" fill="#fff"/>
  </g>
  <circle cx="612" cy="56" r="6" fill="#22c55e"/>
  <text x="626" y="61" font-size="13" font-weight="700" fill="#134e4a">5–10 min downtime</text>
</svg>
