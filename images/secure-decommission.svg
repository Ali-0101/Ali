<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" fill-opacity=".12"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#dots)"/>

  <!-- terminal: factory reset -->
  <g filter="url(#sh)">
    <rect x="60" y="80" width="400" height="300" rx="14" fill="#0b1220"/>
  </g>
  <rect x="60" y="80" width="400" height="38" rx="14" fill="#16213a"/>
  <rect x="60" y="104" width="400" height="14" fill="#16213a"/>
  <circle cx="84" cy="99" r="6" fill="#ef4444"/><circle cx="104" cy="99" r="6" fill="#eab308"/><circle cx="124" cy="99" r="6" fill="#22c55e"/>
  <text x="146" y="104" font-size="13" fill="#64748b">console — old-firewall</text>
  <g font-size="15">
    <text x="84" y="156" fill="#38bdf8"># <tspan fill="#e2e8f0">execute factoryreset</tspan></text>
    <text x="84" y="186" fill="#94a3b8">This will erase all config.</text>
    <text x="84" y="216" fill="#94a3b8">Continue? (y/n) <tspan fill="#e2e8f0">y</tspan></text>
    <text x="84" y="252" fill="#94a3b8">Wiping configuration…</text>
  </g>
  <rect x="84" y="270" width="352" height="14" rx="7" fill="#1e293b"/>
  <rect x="84" y="270" width="352" height="14" rx="7" fill="#38bdf8"/>
  <text x="84" y="322" font-size="15" font-weight="700" fill="#4ade80">✓ device reset · data cleared</text>
  <text x="84" y="350" font-size="15" fill="#38bdf8"># <tspan fill="#e2e8f0">_</tspan></text>

  <!-- clipboard checklist -->
  <g filter="url(#sh)">
    <rect x="500" y="62" width="240" height="360" rx="16" fill="#fff"/>
  </g>
  <rect x="572" y="48" width="96" height="30" rx="10" fill="#1e3a8a"/>
  <text x="620" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#172554">Handover record</text>
  <path d="M528 134H712" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="14" fill="#334155">
    <g transform="translate(528 160)">
      <rect width="24" height="24" rx="6" fill="#dbeafe"/><path d="M6 12l4 4 8-8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17">Serial numbers</text>
    </g>
    <g transform="translate(528 206)">
      <rect width="24" height="24" rx="6" fill="#dbeafe"/><path d="M6 12l4 4 8-8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17">Site records</text>
    </g>
    <g transform="translate(528 252)">
      <rect width="24" height="24" rx="6" fill="#dbeafe"/><path d="M6 12l4 4 8-8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17">Before photos</text>
    </g>
    <g transform="translate(528 298)">
      <rect width="24" height="24" rx="6" fill="#dbeafe"/><path d="M6 12l4 4 8-8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17">After photos</text>
    </g>
    <g transform="translate(528 344)">
      <rect width="24" height="24" rx="6" fill="#dbeafe"/><path d="M6 12l4 4 8-8" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="17">Secure reset</text>
    </g>
  </g>
  <g transform="translate(676 384)">
    <circle r="22" fill="#22c55e"/>
    <path d="M-9 0l6 6 12-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
