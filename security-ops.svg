<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c0519"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#fff" fill-opacity=".04"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c0008" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- monitor wall -->
  <g filter="url(#sh)">
    <rect x="48" y="48" width="500" height="404" rx="16" fill="#111827"/>
  </g>

  <!-- feed 1: corridor -->
  <g transform="translate(64 64)">
    <rect width="226" height="178" rx="8" fill="url(#feed)"/>
    <path d="M0 0L80 70H146L226 0M0 178L80 120H146L226 178M80 70V120M146 70V120" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="98" y="80" width="30" height="40" fill="#334155"/>
    <rect width="226" height="178" rx="8" fill="url(#scan)"/>
    <text x="10" y="20" font-size="11" fill="#cbd5e1">CAM 01 · LOBBY</text>
  </g>
  <!-- feed 2: entrance door with person -->
  <g transform="translate(306 64)">
    <rect width="226" height="178" rx="8" fill="url(#feed)"/>
    <rect x="70" y="40" width="86" height="138" fill="#273244" stroke="#475569" stroke-width="2"/>
    <circle cx="142" cy="112" r="4" fill="#64748b"/>
    <circle cx="112" cy="92" r="13" fill="#94a3b8"/>
    <path d="M90 178v-40c0-14 10-24 22-24s22 10 22 24v40z" fill="#94a3b8"/>
    <rect x="90" y="74" width="46" height="104" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4"/>
    <rect width="226" height="178" rx="8" fill="url(#scan)"/>
    <text x="10" y="20" font-size="11" fill="#cbd5e1">CAM 02 · ENTRANCE</text>
  </g>
  <!-- feed 3: car park -->
  <g transform="translate(64 258)">
    <rect width="226" height="178" rx="8" fill="url(#feed)"/>
    <path d="M30 178L70 90M100 178L105 90M170 178L140 90M200 140L175 90" stroke="#475569" stroke-width="2"/>
    <rect x="110" y="126" width="56" height="28" rx="8" fill="#475569"/>
    <rect x="118" y="114" width="40" height="18" rx="6" fill="#334155"/>
    <rect width="226" height="178" rx="8" fill="url(#scan)"/>
    <text x="10" y="20" font-size="11" fill="#cbd5e1">CAM 03 · CAR PARK</text>
  </g>
  <!-- feed 4: server/store room -->
  <g transform="translate(306 258)">
    <rect width="226" height="178" rx="8" fill="url(#feed)"/>
    <g fill="#273244" stroke="#475569" stroke-width="2">
      <rect x="50" y="50" width="50" height="118"/><rect x="126" y="50" width="50" height="118"/>
    </g>
    <g fill="#22c55e"><circle cx="62" cy="66" r="3"/><circle cx="62" cy="86" r="3"/><circle cx="138" cy="66" r="3"/><circle cx="138" cy="106" r="3"/></g>
    <rect width="226" height="178" rx="8" fill="url(#scan)"/>
    <text x="10" y="20" font-size="11" fill="#cbd5e1">CAM 04 · RESTRICTED</text>
  </g>

  <!-- REC indicator -->
  <circle cx="512" cy="80" r="6" fill="#ef4444"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="474" y="84" font-size="11" font-weight="700" fill="#fca5a5">REC</text>

  <!-- access badge -->
  <g transform="rotate(-6 670 250)" filter="url(#sh)">
    <rect x="590" y="130" width="160" height="230" rx="16" fill="#fff"/>
    <rect x="648" y="144" width="44" height="10" rx="5" fill="#fecdd3"/>
    <circle cx="670" cy="214" r="34" fill="#ffe4e6"/>
    <path d="M670 190l-22 8v14c0 14 9 24 22 28 13-4 22-14 22-28v-14z" fill="#e11d48"/>
    <path d="M660 214l7 7 13-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="670" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#4c0519">SECURITY</text>
    <rect x="618" y="292" width="104" height="8" rx="4" fill="#fecdd3"/>
    <rect x="632" y="310" width="76" height="8" rx="4" fill="#ffe4e6"/>
    <text x="670" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#e11d48">ACCESS · AUTHORISED</text>
  </g>
</svg>
