<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27272a"/>
      <stop offset="1" stop-color="#71717a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#09090b" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- desktop browser -->
  <g filter="url(#sh)">
    <rect x="50" y="56" width="540" height="380" rx="14" fill="#fff"/>
  </g>
  <rect x="50" y="56" width="540" height="36" rx="14" fill="#f4f4f5"/>
  <rect x="50" y="78" width="540" height="14" fill="#f4f4f5"/>
  <circle cx="72" cy="74" r="5" fill="#ef4444"/><circle cx="90" cy="74" r="5" fill="#eab308"/><circle cx="108" cy="74" r="5" fill="#22c55e"/>
  <rect x="200" y="64" width="240" height="20" rx="10" fill="#e4e4e7"/>
  <!-- nav -->
  <rect x="74" y="108" width="70" height="12" rx="6" fill="#18181b"/>
  <g fill="#a1a1aa"><rect x="398" y="110" width="40" height="8" rx="4"/><rect x="450" y="110" width="40" height="8" rx="4"/><rect x="502" y="110" width="64" height="8" rx="4"/></g>
  <!-- hero -->
  <rect x="74" y="136" width="492" height="130" rx="10" fill="url(#hero)"/>
  <rect x="98" y="166" width="220" height="18" rx="9" fill="#fff"/>
  <rect x="98" y="194" width="160" height="10" rx="5" fill="#fff" fill-opacity=".7"/>
  <rect x="98" y="222" width="90" height="26" rx="8" fill="#fff"/>
  <!-- cards -->
  <g fill="#f4f4f5">
    <rect x="74" y="284" width="152" height="128" rx="10"/>
    <rect x="244" y="284" width="152" height="128" rx="10"/>
    <rect x="414" y="284" width="152" height="128" rx="10"/>
  </g>
  <g fill="#99f6e4"><rect x="88" y="298" width="124" height="54" rx="6"/><rect x="258" y="298" width="124" height="54" rx="6"/><rect x="428" y="298" width="124" height="54" rx="6"/></g>
  <g fill="#d4d4d8"><rect x="88" y="366" width="90" height="8" rx="4"/><rect x="258" y="366" width="90" height="8" rx="4"/><rect x="428" y="366" width="90" height="8" rx="4"/></g>
  <g fill="#e4e4e7"><rect x="88" y="384" width="110" height="8" rx="4"/><rect x="258" y="384" width="110" height="8" rx="4"/><rect x="428" y="384" width="110" height="8" rx="4"/></g>

  <!-- selection box (design tool) -->
  <rect x="240" y="280" width="160" height="136" fill="none" stroke="#0ea5e9" stroke-width="2"/>
  <g fill="#fff" stroke="#0ea5e9" stroke-width="2">
    <rect x="235" y="275" width="10" height="10"/><rect x="395" y="275" width="10" height="10"/>
    <rect x="235" y="411" width="10" height="10"/><rect x="395" y="411" width="10" height="10"/>
  </g>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="614" y="100" width="146" height="300" rx="24" fill="#18181b"/>
  </g>
  <rect x="624" y="112" width="126" height="276" rx="16" fill="#fff"/>
  <rect x="664" y="118" width="46" height="8" rx="4" fill="#18181b"/>
  <rect x="636" y="138" width="40" height="8" rx="4" fill="#18181b"/>
  <g fill="#18181b"><rect x="720" y="138" width="18" height="3" rx="1.5"/><rect x="720" y="144" width="18" height="3" rx="1.5"/></g>
  <rect x="636" y="158" width="102" height="80" rx="8" fill="url(#hero)"/>
  <rect x="648" y="178" width="70" height="10" rx="5" fill="#fff"/>
  <rect x="648" y="208" width="44" height="16" rx="5" fill="#fff"/>
  <rect x="636" y="250" width="102" height="56" rx="8" fill="#f4f4f5"/>
  <rect x="644" y="258" width="86" height="26" rx="5" fill="#99f6e4"/>
  <rect x="636" y="316" width="102" height="56" rx="8" fill="#f4f4f5"/>
  <rect x="644" y="324" width="86" height="26" rx="5" fill="#99f6e4"/>

  <!-- cursor + tag -->
  <g transform="translate(400 222)">
    <path d="M0 0l0 30 8-8 6 14 6-3-6-13 11 0z" fill="#0ea5e9" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <rect x="20" y="30" width="44" height="22" rx="6" fill="#0ea5e9"/>
    <text x="42" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Ali</text>
  </g>

  <!-- code tag -->
  <g filter="url(#sh)">
    <rect x="596" y="420" width="164" height="40" rx="10" fill="#18181b"/>
  </g>
  <text x="678" y="445" text-anchor="middle" font-size="13" fill="#5eead4">&lt;/responsive&gt;</text>
</svg>
